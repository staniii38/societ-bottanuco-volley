<!DOCTYPE html><!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Bottanuco Volley</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #024490;
            color: #F5F520;
            padding: 15px;
            font-size: 28px;
            font-weight: bold;
        }
        .indirizzo {
            background-color: #F5F520;
            color: #024490;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        .menu, .submenu {
            margin-top: 30px;
        }
        button {
            display: block;
            width: 250px;
            margin: 10px auto;
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #F5F520;
            color: #024490;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.3s;
        }
        button:hover {
            background-color: #d4d40f;
            transform: scale(1.05);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<header>🏐 Bottanuco Volley 🏐</header>
<div class="indirizzo">📍 Via John Fitzgerald Kennedy, 8, 24040 Bottanuco (BG)</div>

<!-- Menu principale -->
<div id="mainMenu" class="menu">
    <button onclick="showMenu('maschile')">Maschile</button>
    <button onclick="showMenu('femminile')">Femminile</button>
</div>

<!-- Sottomenù Maschile -->
<div id="maschile" class="submenu hidden">
    <button onclick="alert('Seconda Divisione Maschile')">Seconda Divisione</button>
    <button onclick="alert('Prima Divisione Maschile')">Prima Divisione</button>
    <button onclick="alert('Under 17 Maschile')">Under 17</button>
    <button onclick="backToMain()">⬅ Torna al menu</button>
</div>

<!-- Sottomenù Femminile -->
<div id="femminile" class="submenu hidden">
    <button onclick="alert('Seconda Divisione Femminile')">Seconda Divisione</button>
    <button onclick="alert('Terza Divisione Femminile')">Terza Divisione</button>
    <button onclick="alert('Under 14 Femminile')">Under 14</button>
    <button onclick="backToMain()">⬅ Torna al menu</button>
</div>

<script>
    function showMenu(menuId) {
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById(menuId).classList.remove('hidden');
    }
    function backToMain() {
        document.querySelectorAll('.submenu').forEach(menu => menu.classList.add('hidden'));
        document.getElementById('mainMenu').classList.remove('hidden');
    }
</script>

</body>
</html>
